<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<title>TerminalEX</title>
<style>
<?!= include('Styles') ?>
</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" title="Home (Alt+H)" role="button" tabindex="0">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#20232b"/><path d="M8 11l6 5-6 5" stroke="#39d98a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 22h8" stroke="#e6e6e6" stroke-width="3" stroke-linecap="round"/></svg>
        <span>Terminal<b>EX</b></span>
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Open terminals"></nav>
      <div class="newtab">
        <button id="btn-new" class="icon-btn" title="New terminal (Alt+T)" aria-label="New terminal">+</button>
        <button id="btn-new-menu" class="icon-btn caret" title="Choose a terminal" aria-label="Choose a terminal">▾</button>
        <div class="menu" id="new-menu" role="menu"></div>
      </div>
      <div class="spacer"></div>
      <div class="actions">
        <button id="btn-home" class="icon-btn" title="Home: lessons, tests, certificates (Alt+H)" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button>
        <button id="btn-history" class="icon-btn" title="History &amp; family tree" aria-label="History and family tree"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="18" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="18" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v4M12 11l-6 5M12 11l6 5" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
        <button id="btn-missions" class="pill" title="Missions (Alt+M)"><span aria-hidden="true">🏁</span> Missions <span class="xp-badge"><span id="xp-count">0</span> XP</span></button>
        <button id="btn-cheat" class="icon-btn" title="Interactive Cheat Sheet (Alt+C)" aria-label="Interactive Cheat Sheet"><svg viewBox="0 0 24 24"><path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 17a3 3 0 013-3h10" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button>
        <button id="btn-student" class="pill student-pill" title="Your name and progress file"></button>
        <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2.1 1.2M17.7 15.3l2.1 1.2M4.2 16.5l2.1-1.2M17.7 8.7l2.1-1.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-dasharray="3.2 2.3"/></svg></button>
        <button id="btn-full" class="icon-btn" title="Full screen (Alt+Enter)" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      </div>
    </header>

    <main class="workspace">
      <section id="panes" aria-label="Terminal"></section>
      <aside id="drawer" aria-label="Help panel">
        <div class="drawer-head">
          <div class="drawer-tabs">
            <button class="drawer-tab active" data-tab="missions">Missions</button>
            <button class="drawer-tab" data-tab="cheat">Quick reference</button>
            <button class="drawer-tab" data-tab="keys">Keys &amp; tips</button>
          </div>
          <button id="drawer-close" class="icon-btn" aria-label="Close panel">×</button>
        </div>
        <div id="drawer-body"></div>
      </aside>
    </main>

    <div id="touch-keys" aria-hidden="true">
      <button data-k="Tab">Tab</button><button data-k="C-c">^C</button><button data-k="ArrowUp">↑</button><button data-k="ArrowDown">↓</button><button data-k="ArrowLeft">←</button><button data-k="ArrowRight">→</button><button data-k="Escape">Esc</button><button data-k="|">|</button><button data-k="-">-</button><button data-k="/">/</button><button data-k="\">\</button><button data-k="~">~</button><button data-k="$">$</button>
    </div>

    <div id="launcher" class="hidden" role="dialog" aria-modal="true" aria-label="TerminalEX home">
      <div class="launcher-inner home"></div>
    </div>

    <div id="page" class="page" hidden></div>

    <div id="modal-settings" class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-card">
        <div class="modal-head"><h2 id="settings-title">Settings</h2><button id="settings-close" class="icon-btn" aria-label="Close settings">×</button></div>
        <div id="settings-body"></div>
      </div>
    </div>

    <div id="toasts" aria-live="polite"></div>
  </div>
